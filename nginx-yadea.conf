# biztrack.yadea.uk + yadea.biztrack.uk -> Yadea Pakistan (React SPA + PHP api)
server {
    listen 80;
    server_name biztrack.yadea.uk www.biztrack.yadea.uk yadea.biztrack.uk;
    client_max_body_size 100M;

    # certbot-managed redirect to https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name biztrack.yadea.uk www.biztrack.yadea.uk yadea.biztrack.uk;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/yadea.biztrack.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yadea.biztrack.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yadea-pakistan/dist;
    index index.html;

    # phpMyAdmin - hidden path + Basic Auth
    location ^~ /dbadmin {
        auth_basic "Restricted Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;
        alias /var/www/phpmyadmin;
        index index.php;
        location ~ ^/dbadmin/(.+\.php)$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/phpmyadmin/$1;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # API entrypoint with /Yadea/ prefix (+ PATH_INFO routes)
    location ~ ^/Yadea/api/index\.php(?:/(.*))?$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(/Yadea/api/index\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /var/www/yadea-pakistan/api/index.php;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # API entrypoint WITHOUT /Yadea/ prefix (root-accessed SPA)
    location ~ ^/api/index\.php(?:/(.*))?$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(/api/index\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /var/www/yadea-pakistan/api/index.php;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # other direct php files in api (both /Yadea/api/ and /api/)
    location ~ ^/(?:Yadea/)?api/(?<apifile>[^/]+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/yadea-pakistan/api/$apifile;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # yadea static assets (managed by deploy)
    location /Yadea/ {
        alias /var/www/yadea-pakistan/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / { try_files $uri $uri/ /index.html; }
}
